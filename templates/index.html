<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify Key (dev)</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial, sans-serif; padding: 24px; background:#f6f7f9; }
    .box { background:#fff; padding:20px; border-radius:12px; width:100%; max-width:720px; margin:auto; box-shadow:0 4px 16px rgba(0,0,0,.06); }
    h1 { font-size:22px; margin:0 0 12px; }
    p { color:#555; line-height:1.5; }
    input[type=text]{width:100%; padding:12px; font-size:16px; margin:12px 0; border:1px solid #ddd; border-radius:8px;}
    button{padding:12px 16px; font-size:16px; border:none; border-radius:8px; cursor:pointer;}
    button.primary{ background:#0b69ff; color:#fff; }
    pre{background:#0e1111; color:#d1d5db; padding:12px; border-radius:8px; overflow:auto;}
    .hint{font-size:13px; color:#666;}
  </style>
</head>
<body>
  <div class="box">
    <h1>Kiểm tra key (dev sandbox)</h1>
    <p>Nhập key rồi bấm <b>Verify</b>. Nếu hợp lệ, trang sẽ <b>chuyển hướng sang YouTube Mobile</b>.<br>
       Lưu ý: Chỉ dùng để <b>test</b> khi xe đang ở chế độ <b>Đỗ (P)</b> hoặc do hành khách thao tác.</p>
    <input id="key" type="text" placeholder="preyoutube-0389667823-20250925-VF6p">
    <div>
      <button class="primary" onclick="doVerify()">Verify</button>
      <button onclick="fillSample()">Dán mẫu</button>
    </div>
    <p class="hint">Mặc định DB đã seed 1 key mẫu: <code>preyoutube-0389667823-20250925-VF6p</code></p>
    <h3>Kết quả</h3>
    <pre id="out">—</pre>
  </div>

  <script>
    function fillSample(){
      document.getElementById('key').value = 'preyoutube-0389667823-20250925-VF6p';
    }
    async function doVerify(){
      const k = document.getElementById('key').value.trim();
      const out = document.getElementById('out');
      if(!k){ alert('Nhập key'); return; }
      out.textContent = 'Sending...';
      try{
        const r = await fetch('/api/verify', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({key: k})
        });
        const j = await r.json();
        out.textContent = JSON.stringify(j, null, 2);
        if (r.ok && j.ok){
          // Redirect to YouTube Mobile
          window.location.href = 'https://m.youtube.com';
        } else {
          alert('Key không hợp lệ: ' + (j.reason || 'unknown'));
        }
      }catch(e){
        out.textContent = 'Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
